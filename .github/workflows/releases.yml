name: Desktop releases
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            executable: tiamos.exe
          - os: ubuntu-22.04
            target: linux-x64
            executable: tiamos
          - os: macos-15
            target: macos-arm64
            executable: tiamos
          - os: macos-15-intel
            target: macos-x64
            executable: tiamos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libx11-6 libxext6 libxrender1
      - run: python -m pip install -r requirements-build.txt
      - name: Source tests (Linux desktop)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s . -p "test_*.py" -q
      - name: Source tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s . -p "test_*.py" -q
      - run: python scripts/build_release.py
      - name: Packaged desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_release.py dist/tiamos/${{ matrix.executable }}
      - name: Packaged desktop smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: python scripts/smoke_release.py dist/tiamos/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from platform_runtime import VERSION; assert os.environ['RELEASE_TAG'] == 'v' + VERSION"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "tiamos $RELEASE_TAG" --notes-file RELEASES.md
