name: Windows tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s . -p "test_*.py" -v
      - run: python -m py_compile agentlings.py launcher.py codex_float.py cli_sessions.py terminal_session.py window_focus.py terminal_discovery.py avatar_layout.py avatar_starred.py session_activity.py session_metrics.py session_details.py session_history.py group_menu.py profile_charts.py avatar_personality.py avatar_theme.py claude_sessions.py agent_sounds.py platform_runtime.py portable_discovery.py
